services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: veilpass-proof-server_${TESTCONTAINERS_UID:-local}
    command: ['midnight-proof-server']
    ports: ['127.0.0.1::6300']
  node:
    image: midnightntwrk/midnight-node:1.0.2
    container_name: veilpass-node_${TESTCONTAINERS_UID:-local}
    ports: ['127.0.0.1::9944']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 45
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3-hotfix
    container_name: veilpass-indexer_${TESTCONTAINERS_UID:-local}
    ports: ['127.0.0.1::8088']
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 2s
      timeout: 5s
      retries: 45
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: unused-local
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__NODE__URL: ws://node:9944
      APP__INFRA__STORAGE__PASSWORD: indexer
      APP__INFRA__PUB_SUB__PASSWORD: indexer
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: indexer
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    depends_on:
      node:
        condition: service_healthy

name: Hosted issuer readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
jobs:
  public-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/hosted-readiness.mjs

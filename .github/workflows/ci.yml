name: Validate VeilPass
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  constraints-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - run: npm run toolchain:install
      - run: npm run contract:check && npm run lifecycle:check && npm run signed:check
      - run: npm run typecheck && npm run typecheck --prefix integrations/issuance
      - run: npm test && npm test --prefix integrations/issuance
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VEILPASS_BUILD_DIR: .next-signed-build
      - run: npm run test:signed:ui
        env:
          VEILPASS_TEST_BROWSER: chromium
